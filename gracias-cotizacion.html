<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Gracias por tu solicitud — RL Gastronómicos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">

<!-- ══════════════════════════════════════════════════════════════
     GOOGLE ADS — SEGUIMIENTO DE CONVERSIONES
     Reemplaza AW-CONVERSION_ID y AW-CONVERSION_ID/CONVERSION_LABEL
     con los valores reales de tu cuenta de Google Ads:
     Herramientas y configuración → Conversiones → (tu acción de
     conversión "Cotización") → Configuración de etiqueta →
     "Instalar la etiqueta usted mismo" → te da ambos valores.
     ══════════════════════════════════════════════════════════════ -->

<style>
:root {
  --red: #E8431C; --orange: #F5A623; --green: #7DC242; --green-dk: #5A9930;
  --ink: #1C1C1A; --ink2: #3A3A38; --muted: #888885;
  --surface: #F8F7F4; --white: #FFFFFF; --border: rgba(0,0,0,0.07);
  --font-display: 'Bebas Neue', sans-serif;
  --font-body: 'DM Sans', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  background: var(--surface);
  color: var(--ink);
  min-height: 100vh;
  display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased;
}
header {
  padding: 28px 6%;
  display: flex; align-items: center; gap: 11px;
}
header img { height: 56px; width: auto; }
header strong { display: block; font-size: 14px; font-weight: 600; color: var(--ink); line-height: 1.2; }
header span { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }

main {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 40px 6% 80px;
}
.card {
  max-width: 560px; width: 100%; text-align: center;
  background: var(--white); border: 1px solid var(--border);
  border-radius: 14px; padding: 56px 40px;
  box-shadow: 0 16px 56px rgba(0,0,0,0.06);
}
.check {
  width: 72px; height: 72px; border-radius: 50%;
  background: rgba(125,194,66,0.12); color: var(--green-dk);
  display: flex; align-items: center; justify-content: center;
  font-size: 34px; margin: 0 auto 26px;
}
h1 {
  font-family: var(--font-display);
  font-size: clamp(32px, 4vw, 44px);
  letter-spacing: 1px; line-height: 1.05; margin-bottom: 16px;
}
h1 .accent { color: var(--red); }
p {
  font-size: 15px; line-height: 1.75; color: var(--muted);
  font-weight: 300; max-width: 420px; margin: 0 auto 32px;
}
.actions { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.btn-primary {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 14px 28px; border-radius: 8px;
  background: var(--red); color: #fff;
  font-weight: 600; font-size: 14px; text-decoration: none;
  box-shadow: 0 4px 20px rgba(232,67,28,0.3);
  transition: background 0.2s, transform 0.15s;
}
.btn-primary:hover { background: #cc3b18; transform: translateY(-2px); }
.phones {
  margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--border);
  font-size: 13px; color: var(--muted);
}
.phones a { color: var(--ink); font-weight: 600; text-decoration: none; }
.phones a:hover { color: var(--red); }
</style>
</head>
<body>

<header>
  <img src="img/RLlogo.png" alt="">
  <div>
    <strong>RL SERVICIOS</strong>
    <span>Gastronómicos</span>
  </div>
</header>

<main>
  <div class="card">
    <div class="check">✓</div>
    <h1>¡GRACIAS POR TU<br><span class="accent">SOLICITUD</span>!</h1>
    <p>
      Recibimos tu solicitud de cotización. Nuestro equipo la está revisando
      y te contactaremos en menos de 24 horas con una propuesta personalizada
      para tu empresa.
    </p>
    <div class="actions">
      <a href="index.html" class="btn-primary">Volver al inicio →</a>
    </div>
    <div class="phones">
      ¿Necesitas hablar con nosotros ahora?<br>
      <a href="tel:6646803096">664 680 3096</a>
    </div>
  </div>
</main>

</body>
</html>
